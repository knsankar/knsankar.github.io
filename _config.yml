# ─────────────────────────────────────────────────────────────
#  knsankar.github.io — "Chicago"
#  Windows 95/98 desktop · 90s nostalgia · SEO + AI-agent ready
# ─────────────────────────────────────────────────────────────

# ── identity ────────────────────────────────────────────────
title: knsankar
name: knsankar
description: Notes on security engineering, detection, and databases.
lang: en

# ── urls ────────────────────────────────────────────────────
url: https://www.knsankar.in
permalink: /:title/

# ── theme ───────────────────────────────────────────────────
# auto = follow the visitor's OS setting until they choose
theme-mode: auto   # auto | dark | light

# ── retro chrome (read by the 90s includes) ─────────────────
retro:
  counter: "004219"
  under_construction: true
  under_construction_page: false

# ── social (read by the nav / footer includes) ──────────────
github: knsankar
email: knsankar@protonmail.com
twitter:
  username: knsankar

# read by jekyll-seo-tag + the JSON-LD schema
logo: /assets/images/profile.jpg
social:
  name: knsankar
  links:
    - https://github.com/knsankar
    - https://twitter.com/knsankar
    - mailto:knsankar@protonmail.com

# author card + schema.org Person
author:
  name: knsankar
  bio: A security enthusiast.
  picture: /assets/images/profile.jpg
  twitter: knsankar

# ── post presentation ───────────────────────────────────────
read-time: true
related: true
show-author: true
show-tags: true

# ── plugins (GitHub Pages allowlist only) ───────────────────
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jemoji
  - jekyll-gist
  - jekyll-sitemap

# ── defaults ────────────────────────────────────────────────
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      category: blog
  - scope:
      path: ""
      type: pages
    values:
      layout: window

# ── html compression (pure Liquid layout, GH Pages safe) ────
compress_html:
  ignore:
    envs:
      - development
      - stage

# ── excluded from the build ─────────────────────────────────
exclude:
  - README.md
  - FAQ.md
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - vendor
  - node_modules
  - script
  - _config-dev.yml
  - .trae
  - preview
