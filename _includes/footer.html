<footer class="site-foot">
  <div class="site-foot__panel">
    {% include counter.html %}
    {% include social-links.html %}
  </div>
  <div class="statusbar">
    <span class="statusbar__seg">{{ page.url | default: '/' }}</span>
    <span class="statusbar__seg">{{ site.posts | size }} post(s)</span>
    <span class="statusbar__seg">Made with Notepad</span>
    <span class="statusbar__seg statusbar__seg--grow"></span>
    {% if include.readtime != '' %}<span class="statusbar__seg">{{ include.readtime }}</span>{% endif %}
    <span class="statusbar__seg"><a href="{{ '/llms.txt' | relative_url }}">llms.txt</a></span>
    <span class="statusbar__seg"><a href="{{ '/sitemap.xml' | relative_url }}">Sitemap</a></span>
    <span class="statusbar__seg">&copy; {{ site.time | date: '%Y' }} {{ site.title }}</span>
  </div>
</footer>
