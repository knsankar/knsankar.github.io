<li>
  <a href="{{ post.url | relative_url }}">
    <span class="post-row__date">{{ post.date | date: "%Y-%m-%d" }}</span>
    <span class="post-row__title">{{ post.title }}{% if site.read-time %} <span class="post-row__meta">{% include read-time.html content=post.content %}</span>{% endif %}</span>
  </a>
</li>
