<div class="social">
  {% if site.github %}
    <a href="https://github.com/{{ site.github }}" rel="me noopener" target="_blank">
      <svg aria-hidden="true"><use xlink:href="#icon-github"></use></svg>GitHub
    </a>
  {% endif %}
  {% if site.twitter.username %}
    <a href="https://twitter.com/{{ site.twitter.username }}" rel="me noopener" target="_blank">
      <svg aria-hidden="true"><use xlink:href="#icon-twitter"></use></svg>Twitter
    </a>
  {% endif %}
  {% if site.email %}
    <a href="mailto:{{ site.email }}">
      <svg aria-hidden="true"><use xlink:href="#icon-mail"></use></svg>Email
    </a>
  {% endif %}
  <a href="{{ '/feed.xml' | relative_url }}">
    <svg aria-hidden="true"><use xlink:href="#icon-rss"></use></svg>RSS
  </a>
</div>
