---
layout: compress
---
<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {% seo %}

    {% include favicon.html %}
    {% include theme-bootstrap.html %}

    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>

    <a class="skip-link" href="#main">Skip to content</a>

    {% include marquee.html %}

    <main id="main">
    {{ content }}
    </main>

    {% include taskbar.html %}
    {% include icons.html %}

    <script>
      (function () {
        var root = document.documentElement;

        /* ---- theme toggle ---- */
        var btn = document.getElementById("theme-toggle");
        if (btn) {
          var label = document.getElementById("theme-toggle-label");
          var icon = document.getElementById("theme-toggle-icon");
          function current() {
            var t = root.getAttribute("data-theme");
            if (t) return t;
            return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          function sync() {
            var c = current();
            label.textContent = c === "dark" ? "Dark" : "Light";
            icon.textContent = c === "dark" ? "\u263E" : "\u2600";
            btn.setAttribute("aria-pressed", c === "dark" ? "true" : "false");
          }
          btn.addEventListener("click", function () {
            var next = current() === "dark" ? "light" : "dark";
            root.setAttribute("data-theme", next);
            try { localStorage.setItem("win95-theme", next); } catch (e) {}
            sync();
          });
          sync();
        }

        /* ---- taskbar clock ---- */
        var clock = document.getElementById("clock");
        function tick() {
          if (!clock) return;
          var d = new Date();
          var hh = String(d.getHours());
          if (hh.length < 2) hh = "0" + hh;
          var mm = String(d.getMinutes());
          if (mm.length < 2) mm = "0" + mm;
          clock.textContent = hh + ":" + mm;
          clock.setAttribute("datetime", d.toISOString());
        }
        tick();
        if (clock) window.setInterval(tick, 20000);

        /* ---- Start menu: dismiss on Escape / outside click ---- */
        var start = document.querySelector(".start");
        if (start) {
          document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") start.removeAttribute("open");
          });
          document.addEventListener("click", function (e) {
            if (!start.contains(e.target)) start.removeAttribute("open");
          });
        }

        /* ---- desktop window manager (drag / minimize / maximize / close) ---- */
        (function () {
          var win = document.querySelector("[data-window]");
          if (!win) return;
          var titlebar = win.querySelector(".titlebar");
          var tasks = document.querySelector(".tasks");
          var deskIcon = document.querySelector("[data-desktop-icon]");
          var winTitle = win.getAttribute("data-window-title") || document.title;

          var task = document.createElement("button");
          task.type = "button";
          task.className = "task task--window";
          task.setAttribute("aria-pressed", "true");
          task.innerHTML = '<svg aria-hidden="true"><use xlink:href="#icon-folder"></use></svg><span></span>';
          task.querySelector("span").textContent = winTitle;
          var taskShown = false;

          function showTask() {
            if (!tasks || taskShown) return;
            tasks.insertBefore(task, tasks.firstChild);
            taskShown = true;
          }
          function hideTask() {
            if (taskShown && task.parentNode) task.parentNode.removeChild(task);
            taskShown = false;
          }

          var state = "normal"; /* normal | minimized | maximized | closed */
          var tx = 0, ty = 0;

          function apply() {
            win.classList.toggle("window--min", state === "minimized");
            win.classList.toggle("window--max", state === "maximized");
            win.classList.toggle("window--closed", state === "closed");
            var open = state === "normal" || state === "maximized";
            task.classList.toggle("task--active", open);
            task.setAttribute("aria-pressed", open ? "true" : "false");
            if (deskIcon) deskIcon.hidden = state !== "closed";
          }

          win.querySelectorAll(".win-btn").forEach(function (btn) {
            btn.addEventListener("click", function () {
              var act = btn.getAttribute("data-win");
              if (act === "min") {
                if (!tasks) return; /* nowhere to minimize to */
                state = state === "minimized" ? "normal" : "minimized";
                showTask();
              } else if (act === "max") {
                state = state === "maximized" ? "normal" : "maximized";
                showTask();
              } else if (act === "close") {
                state = "closed";
                hideTask();
              }
              apply();
            });
          });

          task.addEventListener("click", function () {
            state = state === "minimized" ? "normal" : "minimized";
            apply();
          });

          if (deskIcon) {
            deskIcon.addEventListener("click", function () {
              state = "normal";
              tx = 0; ty = 0;
              win.style.transform = "";
              showTask();
              apply();
            });
          }

          /* ---- drag by the title bar ---- */
          var dragging = false, startX = 0, startY = 0, baseX = 0, baseY = 0, home = null;

          titlebar.addEventListener("pointerdown", function (e) {
            if (e.button !== 0 || state === "maximized") return;
            if (e.target.closest(".win-btn")) return;
            var r = win.getBoundingClientRect();
            home = { left: r.left - tx, top: r.top - ty, width: r.width };
            dragging = true;
            startX = e.clientX; startY = e.clientY;
            baseX = tx; baseY = ty;
            win.classList.add("window--dragging");
            titlebar.setPointerCapture(e.pointerId);
            e.preventDefault();
          });

          titlebar.addEventListener("pointermove", function (e) {
            if (!dragging) return;
            var nx = baseX + (e.clientX - startX);
            var ny = baseY + (e.clientY - startY);
            var wantLeft = home.left + nx;
            var wantTop = home.top + ny;
            var vw = window.innerWidth, vh = window.innerHeight;
            var bar = document.querySelector(".taskbar");
            var barH = bar ? bar.offsetHeight : 0;
            var minLeft = Math.min(0, vw - home.width);
            var maxLeft = Math.max(0, vw - home.width);
            var maxTop = Math.max(0, vh - barH - 30);
            var left = Math.min(maxLeft, Math.max(minLeft, wantLeft));
            var top = Math.min(maxTop, Math.max(0, wantTop));
            tx = nx + (left - wantLeft);
            ty = ny + (top - wantTop);
            win.style.transform = "translate(" + tx + "px," + ty + "px)";
          });

          function endDrag(e) {
            if (!dragging) return;
            dragging = false;
            win.classList.remove("window--dragging");
            try { titlebar.releasePointerCapture(e.pointerId); } catch (err) {}
          }
          titlebar.addEventListener("pointerup", endDrag);
          titlebar.addEventListener("pointercancel", endDrag);

          /* double-click the title bar to snap back to centre */
          titlebar.addEventListener("dblclick", function (e) {
            if (e.target.closest(".win-btn")) return;
            tx = 0; ty = 0;
            win.style.transform = "";
          });

          showTask();
          apply();
        })();
      })();
    </script>

</body>
</html>
